name: Build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FileFlow.sln
      - name: Build
        run: dotnet build FileFlow.sln -c Release --no-restore
      - name: Filesystem checks
        run: dotnet run --project tests/FileFlow.Checks -c Release --no-build
      - name: Verify portable publish
        run: dotnet publish src/FileFlow/FileFlow.csproj -c Release --no-restore --self-contained false -o artifacts/FileFlow
      - name: Include license and launch instructions
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/FileFlow/LICENSE.txt
          Copy-Item docs/PORTABLE.txt artifacts/FileFlow/READ-ME.txt
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: FileFlow-Windows
          path: artifacts/FileFlow/
          if-no-files-found: error
          retention-days: 30
